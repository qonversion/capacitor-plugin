name: Checks
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        name: Checkout
        
      - uses: borales/actions-yarn@v3.0.0
        name: Validation
        with:
          cmd: install

  spm:
    name: SPM (iOS)
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v4
      # The podspec and Package.swift must pin the same QonversionSandwich version
      # (`fastlane upgrade_sandwich version:x.y.z` bumps both).
      - name: Check the QonversionSandwich pins match
        run: |
          pod_pin=$(grep -oE 's.dependency "QonversionSandwich", "[0-9.]+"' QonversionCapacitorPlugin.podspec | grep -oE '"[0-9.]+"$' | tr -d '"')
          spm_pin=$(grep -oE 'sandwich-sdk.git", exact: "[0-9.]+"' Package.swift | grep -oE '"[0-9.]+"$' | tr -d '"')
          echo "podspec: $pod_pin, Package.swift: $spm_pin"
          [ -n "$pod_pin" ] && [ "$pod_pin" = "$spm_pin" ] || { echo "::error::QonversionSandwich pin mismatch between the podspec and Package.swift"; exit 1; }
      # Builds the plugin as the Swift package Capacitor 8 apps consume (SPM is the default package manager there).
      - name: Build the Swift package
        run: |
          xcodebuild -scheme QonversionCapacitor \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO
